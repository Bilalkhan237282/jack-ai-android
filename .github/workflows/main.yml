          import android.net.Uri;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.RecognitionListener;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import com.google.firebase.auth.FirebaseAuth;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              final String API_URL =
                  "https://jack-ai-1.ai.studio/api/chat/stream";
              final String IMAGE_API_URL =
                  "https://jack-ai-android.devilxd302777.workers.dev/generate";

              final int BG = Color.rgb(8, 15, 35);
              final int CYAN = Color.rgb(0, 220, 255);
              final int WHITE = Color.WHITE;

              LinearLayout messages;
              EditText input;
              ScrollView scroll;
              Button send, mic, languageButton, wakeButton, floatingButton, imageButton;

