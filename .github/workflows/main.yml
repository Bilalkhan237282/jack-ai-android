
name: Build JACK AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jackai/assistant

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JACK AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.jackai.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jackai.assistant"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 7
                  versionName = "1.6"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <queries>
                  <package android:name="com.whatsapp"/>
                  <package android:name="com.google.android.youtube"/>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="JACK AI"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jackai/assistant/MainActivity.java <<'EOF'
          package com.jackai.assistant;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.speech.RecognizerIntent;
          import android.speech.RecognitionListener;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              final String API_URL =
                  "https://jack-ai-1.ai.studio/api/chat/stream";

              final int BG = Color.rgb(8, 15, 35);
              final int CYAN = Color.rgb(0, 220, 255);
              final int WHITE = Color.WHITE;

              LinearLayout messages;
              EditText input;
              ScrollView scroll;
              Button send, mic, languageButton, wakeButton;

              JSONArray history = new JSONArray();

              boolean busy = false;
              boolean english = false;
              boolean wakeWordActive = false;
              boolean wakeCommandPending = false;
              boolean activityPaused = false;

              SpeechRecognizer recognizer;
              TextToSpeech tts;
              boolean ttsReady = false;

              Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  TextView header = new TextView(this);
                  header.setText("JACK AI");
                  header.setTextColor(CYAN);
                  header.setTextSize(27);
                  header.setTypeface(null, Typeface.BOLD);
                  header.setGravity(Gravity.CENTER);
                  header.setPadding(12, 22, 12, 16);
                  root.addView(header);

                  TextView welcome = new TextView(this);
                  welcome.setText("Ji boss! Kya kaam hai?");
                  welcome.setTextColor(WHITE);
                  welcome.setTextSize(17);
                  welcome.setGravity(Gravity.CENTER);
                  welcome.setPadding(10, 5, 10, 16);
                  root.addView(welcome);

                  scroll = new ScrollView(this);
                  messages = new LinearLayout(this);
                  messages.setOrientation(LinearLayout.VERTICAL);
                  messages.setPadding(12, 12, 12, 12);
                  scroll.addView(messages);

                  root.addView(scroll,
                      new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setOrientation(LinearLayout.HORIZONTAL);
                  bottom.setGravity(Gravity.CENTER_VERTICAL);
                  bottom.setPadding(3, 8, 3, 12);

                  input = new EditText(this);
                  input.setHint("Message JACK AI...");
                  input.setHintTextColor(Color.LTGRAY);
                  input.setTextColor(WHITE);
                  input.setSingleLine(true);
                  input.setImeOptions(EditorInfo.IME_ACTION_SEND);
                  input.setBackgroundTintList(
                      ColorStateList.valueOf(CYAN));

                  bottom.addView(input,
                      new LinearLayout.LayoutParams(0, -2, 1));

                  languageButton = new Button(this);
                  languageButton.setText("UR");
                  languageButton.setTextSize(10);
                  bottom.addView(languageButton);

                  mic = new Button(this);
                  mic.setText("MIC");
                  mic.setTextSize(10);
                  bottom.addView(mic);

                  send = new Button(this);
                  send.setText("SEND");
                  send.setTextSize(10);
                  bottom.addView(send);

                  root.addView(bottom);

                  wakeButton = new Button(this);
                  wakeButton.setText("WAKE WORD: OFF");
                  wakeButton.setTextColor(WHITE);
                  root.addView(wakeButton);

                  setContentView(root);

                  languageButton.setOnClickListener(v -> {
                      english = !english;
                      languageButton.setText(english ? "EN" : "UR");
                      setTtsLanguage();
                  });

                  mic.setOnClickListener(v -> startVoiceInput());
                  send.setOnClickListener(v -> sendMessage());
                  wakeButton.setOnClickListener(v -> toggleWakeWord());

                  input.setOnEditorActionListener((v, actionId, event) -> {
                      sendMessage();
                      return true;
                  });

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true;
                          configureTts();
                      }
                  });

                  addBubble(
                      "JACK AI: Main tumhari madad ke liye hazir hoon.",
                      WHITE, Gravity.START);
              }

              void configureTts() {
                  if (tts == null || !ttsReady) return;

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {
                      @Override
                      public void onStart(String id) {}

                      @Override
                      public void onDone(String id) {
                          handler.post(() -> {
                              if (isFinishing() || activityPaused) return;

                              if ("JACK_WAKE_GREETING".equals(id) &&
                                  wakeCommandPending) {
                                  beginListening(false);
                              }

                              if ("JACK_REPLY".equals(id) &&
                                  wakeCommandPending) {
                                  wakeCommandPending = false;
                                  restartWakeWord();
                              }
                          });
                      }

                      @Override
                      public void onError(String id) {
                          handler.post(() -> {
                              if ("JACK_REPLY".equals(id) &&
                                  wakeCommandPending) {
                                  wakeCommandPending = false;
                                  restartWakeWord();
                              }
                          });
                      }
                  });

                  setTtsLanguage();
              }

              void setTtsLanguage() {
                  if (tts == null || !ttsReady) return;

                  Locale locale = english
                      ? Locale.US : new Locale("ur", "PK");

                  int result = tts.setLanguage(locale);

                  if (result == TextToSpeech.LANG_MISSING_DATA ||
                      result == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts.setLanguage(Locale.US);
                      Toast.makeText(this,
                          "Selected voice unavailable. Using fallback.",
                          Toast.LENGTH_LONG).show();
                      return;
                  }

                  tts.setSpeechRate(english ? 0.92f : 0.82f);
                  tts.setPitch(1.0f);

                  try {
                      Set<Voice> voices = tts.getVoices();
                      Voice best = null;

                      if (voices != null) {
                          for (Voice voice : voices) {
                              if (voice.getLocale().getLanguage()
                                  .equals(locale.getLanguage()) &&
                                  !voice.isNetworkConnectionRequired()) {
                                  if (best == null ||
                                      voice.getQuality() > best.getQuality()) {
                                      best = voice;
                                  }
                              }
                          }
                      }

                      if (best != null) tts.setVoice(best);
                  } catch (Exception ignored) {}
              }

              void speak(String text) {
                  if (tts != null && ttsReady &&
                      text != null && !text.trim().isEmpty()) {
                      tts.setSpeechRate(english ? 0.92f : 0.82f);
                      tts.setPitch(1.0f);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH,
                          null, "JACK_REPLY");
                  }
              }

              void speakWakeGreeting() {
                  if (tts != null && ttsReady) {
                      String greeting = english
                          ? "Yes boss! How can I help you?"
                          : "جی باس! کیا کام ہے؟";

                      tts.speak(greeting, TextToSpeech.QUEUE_FLUSH,
                          null, "JACK_WAKE_GREETING");
                  } else {
                      handler.postDelayed(() -> {
                          if (wakeCommandPending && !isFinishing()) {
                              beginListening(false);
                          }
                      }, 1200);
                  }
              }

              void toggleWakeWord() {
                  if (wakeWordActive) {
                      stopWakeWord();
                      Toast.makeText(this, "Wake Word OFF",
                          Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      return;
                  }

                  startWakeWord();
              }

              void startWakeWord() {
                  if (activityPaused) return;

                  wakeCommandPending = false;
                  wakeWordActive = true;
                  wakeButton.setText("WAKE WORD: ON");
                  mic.setText("WAKE...");

                  Toast.makeText(this,
                      "JACK is listening for Hey JACK",
                      Toast.LENGTH_SHORT).show();

                  beginListening(true);
              }

              void stopWakeWord() {
                  wakeWordActive = false;
                  wakeCommandPending = false;
                  wakeButton.setText("WAKE WORD: OFF");
                  mic.setText("MIC");
                  handler.removeCallbacksAndMessages(null);

                  if (recognizer != null) {
                      try {
                          recognizer.cancel();
                          recognizer.destroy();
                      } catch (Exception ignored) {}
                      recognizer = null;
                  }
              }

              void restartWakeWord() {
                  if (!wakeWordActive || isFinishing() ||
                      activityPaused) return;

                  handler.postDelayed(() -> {
                      if (wakeWordActive && !activityPaused &&
                          !isFinishing()) {
                          beginListening(true);
                      }
                  }, 900);
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults);

                  if (requestCode == 101 && grantResults.length > 0 &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startWakeWord();
                  } else if (requestCode == 101) {
                      Toast.makeText(this,
                          "Microphone permission is required.",
                          Toast.LENGTH_LONG).show();
                  }
              }

              void startVoiceInput() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      return;
                  }

                  if (wakeWordActive) stopWakeWord();
                  wakeCommandPending = false;
                  beginListening(false);
              }

              void beginListening(boolean wakeSession) {
                  if (isFinishing() || activityPaused) return;

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      if (wakeSession) stopWakeWord();
                      Toast.makeText(this,
                          "Speech recognition unavailable.",
                          Toast.LENGTH_LONG).show();
                      return;
                  }

                  try {
                      if (recognizer != null) {
                          recognizer.cancel();
                          recognizer.destroy();
                      }

                      recognizer =
                          SpeechRecognizer.createSpeechRecognizer(this);

                      recognizer.setRecognitionListener(
                          new RecognitionListener() {
                          @Override
                          public void onReadyForSpeech(Bundle params) {
                              mic.setText(wakeSession ? "WAKE..." : "LISTENING");
                          }

                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] b) {}
                          @Override public void onPartialResults(Bundle b) {}
                          @Override public void onEvent(int e, Bundle b) {}

                          @Override
                          public void onEndOfSpeech() {
                              if (!wakeWordActive) mic.setText("MIC");
                          }

                          @Override
                          public void onError(int error) {
                              if (wakeSession && wakeWordActive) {
                                  restartWakeWord();
                              } else if (wakeCommandPending) {
                                  wakeCommandPending = false;
                                  mic.setText("MIC");
                                  speak("Sorry, please say your command again.");
                                  restartWakeWord();
                              } else {
                                  mic.setText("MIC");
                                  Toast.makeText(MainActivity.this,
                                      "Voice not recognized. Try again.",
                                      Toast.LENGTH_SHORT).show();
                              }
                          }

                          @Override
                          public void onResults(Bundle results) {
                              if (results == null) {
                                  if (wakeSession) restartWakeWord();
                                  return;
                              }

                              java.util.ArrayList<String> matches =
                                  results.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION);

                              if (matches == null || matches.isEmpty()) {
                                  if (wakeSession) restartWakeWord();
                                  return;
                              }

                              String spoken = matches.get(0);

                              if (wakeSession) {
                                  String normalized = spoken
                                      .toLowerCase(Locale.ROOT)
                                      .replaceAll("[^a-z ]", " ")
                                      .replaceAll("\\s+", " ")
                                      .trim();

                                  int index = normalized.indexOf("hey jack");
                                  if (index < 0) {
                                      index = normalized.indexOf("heyjack");
                                  }

                                  if (index >= 0) {
                                      wakeWordActive = false;
                                      wakeButton.setText("WAKE WORD: OFF");
                                      wakeCommandPending = true;

                                      String command = normalized
                                          .replaceFirst("hey\\s*jack", "")
                                          .trim();

                                      if (!command.isEmpty()) {
                                          handleVoiceCommand(command);
                                      } else {
                                          speakWakeGreeting();
                                      }
                                  } else {
                                      restartWakeWord();
                                  }
                              } else {
                                  mic.setText("MIC");
                                  handleVoiceCommand(spoken);
                              }
                          }
                      });

                      Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH);

                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);

                      String lang = wakeSession
                          ? "en-US" : (english ? "en-US" : "ur-PK");

                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, lang);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);

                      recognizer.startListening(intent);

                  } catch (Exception e) {
                      if (wakeSession) restartWakeWord();
                      else if (wakeCommandPending) {
                          wakeCommandPending = false;
                          restartWakeWord();
                      }
                  }
              }

              void handleVoiceCommand(String command) {
                  String text = command == null ? "" :
                      command.toLowerCase(Locale.ROOT).trim();

                  if (text.isEmpty()) {
                      if (wakeCommandPending) speakWakeGreeting();
                      return;
                  }

                  if (openPhoneFeature(text)) return;

                  input.setText(command);
                  sendMessage();
              }

              boolean openPhoneFeature(String command) {
                  String c = command.toLowerCase(Locale.ROOT);

                  boolean youtube =
                      c.contains("youtube") || c.contains("you tube");

                  boolean whatsapp =
                      c.contains("whatsapp") || c.contains("whats app");

                  boolean camera =
                      c.contains("camera") || c.contains("take a photo");

                  boolean settings =
                      c.contains("settings") || c.contains("phone setting");

                  if (!youtube && !whatsapp && !camera && !settings) {
                      return false;
                  }

                  try {
                      Intent intent;

                      if (youtube) {
                          intent = getPackageManager()
                              .getLaunchIntentForPackage(
                                  "com.google.android.youtube");

                          if (intent == null) {
                              intent = new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://www.youtube.com"));
                          }

                          speak("Opening YouTube.");

                      } else if (whatsapp) {
                          intent = getPackageManager()
                              .getLaunchIntentForPackage("com.whatsapp");

                          if (intent == null) {
                              intent = new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://www.whatsapp.com"));
                          }

                          speak("Opening WhatsApp.");

                      } else if (camera) {
                          intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          speak("Opening camera.");

                      } else {
                          intent = new Intent(
                              android.provider.Settings.ACTION_SETTINGS);
                          speak("Opening settings.");
                      }

                      // FIX: final variable for lambda use
                      final Intent launchIntent = intent;
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                      handler.postDelayed(() -> {
                          try {
                              startActivity(launchIntent);
                          } catch (Exception e) {
                              Toast.makeText(this,
                                  "Could not open this app.",
                                  Toast.LENGTH_SHORT).show();
                          }
                      }, 1000);

                  } catch (Exception e) {
                      speak("Sorry, I could not open that app.");
                  }

                  return true;
              }

              void sendMessage() {
                  String question = input.getText().toString().trim();

                  if (question.isEmpty() || busy) return;

                  busy = true;
                  send.setEnabled(false);
                  input.setText("");

                  addBubble("You: " + question, CYAN, Gravity.END);

                  try {
                      JSONObject userMessage = new JSONObject();
                      userMessage.put("role", "user");
                      userMessage.put("content", question);
                      history.put(userMessage);

                      JSONArray requestHistory =
                          new JSONArray(history.toString());

                      TextView reply = addBubble(
                          "JACK AI: ", WHITE, Gravity.START);

                      new Thread(() -> {
                          StringBuilder answer = new StringBuilder();
                          HttpURLConnection connection = null;

                          try {
                              JSONObject body = new JSONObject();
                              body.put("messages", requestHistory);
                              body.put("replyLanguage", "auto");
                              body.put("uiLanguage", english ? "en" : "ur");
                              body.put("thinkingDepth", "medium");
                              body.put("smartMemoryEnabled", false);
                              body.put("voiceMode", true);
                              body.put("voiceSpeechLanguage",
                                  english ? "en" : "ur");

                              URL url = new URL(API_URL);
                              connection =
                                  (HttpURLConnection) url.openConnection();

                              connection.setRequestMethod("POST");
                              connection.setConnectTimeout(20000);
                              connection.setReadTimeout(90000);
                              connection.setDoOutput(true);
                              connection.setRequestProperty(
                                  "Content-Type", "application/json");
                              connection.setRequestProperty(
                                  "Accept", "text/event-stream");

                              byte[] data =
                                  body.toString().getBytes("UTF-8");

                              try (OutputStream output =
                                  connection.getOutputStream()) {
                                  output.write(data);
                              }

                              int status = connection.getResponseCode();

                              if (status != 200) {
                                  InputStream es = connection.getErrorStream();
                                  StringBuilder error =
                                      new StringBuilder("HTTP " + status);

                                  if (es != null) {
                                      BufferedReader er = new BufferedReader(
                                          new InputStreamReader(es, "UTF-8"));
                                      String el;
                                      while ((el = er.readLine()) != null) {
                                          error.append(el);
                                      }
                                  }

                                  throw new Exception(error.toString());
                              }

                              try (BufferedReader reader =
                                  new BufferedReader(new InputStreamReader(
                                      connection.getInputStream(), "UTF-8"))) {

                                  String line;
                                  boolean completed = false;

                                  while ((line = reader.readLine()) != null) {
                                      if (!line.startsWith("data:")) continue;

                                      String jsonText =
                                          line.substring(5).trim();

                                      if (jsonText.isEmpty()) continue;

                                      JSONObject event =
                                          new JSONObject(jsonText);

                                      String type = event.optString("type");

                                      if ("delta".equals(type)) {
                                          answer.append(event.optString("text"));
                                          String current = answer.toString();

                                          runOnUiThread(() ->
                                              reply.setText("JACK AI: " + current));
                                      }

                                      if ("error".equals(type)) {
                                          throw new Exception(
                                              event.optString("message",
                                                  "AI response failed"));
                                      }

                                      if ("done".equals(type)) completed = true;
                                  }

                                  if (!completed || answer.length() == 0) {
                                      throw new Exception(
                                          "AI response was incomplete.");
                                  }
                              }

                              JSONObject assistantMessage = new JSONObject();
                              assistantMessage.put("role", "assistant");
                              assistantMessage.put("content", answer.toString());
                              history.put(assistantMessage);

                              String finalAnswer = answer.toString();
                              runOnUiThread(() -> speak(finalAnswer));

                          } catch (Exception e) {
                              String error = e.getMessage();

                              runOnUiThread(() -> {
                                  reply.setText("JACK AI: Connection error: " +
                                      error);

                                  if (wakeCommandPending) {
                                      wakeCommandPending = false;
                                      restartWakeWord();
                                  }
                              });

                          } finally {
                              if (connection != null) connection.disconnect();

                              runOnUiThread(() -> {
                                  busy = false;
                                  send.setEnabled(true);
                                  input.requestFocus();

                                  scroll.post(() ->
                                      scroll.fullScroll(View.FOCUS_DOWN));
                              });
                          }
                      }).start();

                  } catch (Exception e) {
                      busy = false;
                      send.setEnabled(true);
                      addBubble("Error: " + e.getMessage(),
                          WHITE, Gravity.START);
                  }
              }

              TextView addBubble(String text, int color, int gravity) {
                  TextView bubble = new TextView(this);
                  bubble.setText(text);
                  bubble.setTextColor(color);
                  bubble.setTextSize(16);
                  bubble.setPadding(14, 12, 14, 12);

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-2, -2);
                  params.gravity = gravity;
                  params.setMargins(4, 8, 4, 8);

                  messages.addView(bubble, params);

                  scroll.post(() ->
                      scroll.fullScroll(View.FOCUS_DOWN));

                  return bubble;
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  activityPaused = true;

                  if (wakeWordActive) stopWakeWord();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  activityPaused = false;
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);

                  if (recognizer != null) {
                      try {
                          recognizer.cancel();
                          recognizer.destroy();
                      } catch (Exception ignored) {}
                      recognizer = null;
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JACK-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
