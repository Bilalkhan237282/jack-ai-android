              void toggleFloatingJack() {
                  if (FloatingJackService.isRunning()) {
                      stopService(new Intent(this, FloatingJackService.class));
                      floatingButton.setText("FLOATING JACK: OFF");
                      Toast.makeText(this,
                          "Floating JACK is OFF.",
                          Toast.LENGTH_SHORT).show();
                      return;
                  }

                  if (Settings.canDrawOverlays(this)) {
                      Intent service = new Intent(this, FloatingJackService.class);
                      startService(service);
                      floatingButton.setText("FLOATING JACK: ON");
                      Toast.makeText(this,
                          "Floating JACK is ON.",
                          Toast.LENGTH_SHORT).show();
                  } else {
                      Intent permission = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName()));
                      startActivity(permission);
                      Toast.makeText(this,
                          "Allow Display over other apps, then return and tap FLOATING JACK.",
                          Toast.LENGTH_LONG).show();
                  }
              }

              void openImageGenerator() {
                  EditText prompt = new EditText(this);
                  prompt.setHint("Describe the image you want...");
                  prompt.setTextColor(WHITE);
                  prompt.setHintTextColor(Color.LTGRAY);
                  prompt.setMinLines(2);
                  prompt.setPadding(22, 16, 22, 16);
                  new android.app.AlertDialog.Builder(this)
                      .setTitle("JACK AI Image Generator")
                      .setMessage("Apna image prompt likho. Firebase anonymous login ke zariye request authenticate hogi.")
                      .setView(prompt)
                      .setNegativeButton("CANCEL", (dialog, which) -> dialog.dismiss())
                      .setPositiveButton("GENERATE IMAGE", (dialog, which) -> {
                          String text = prompt.getText().toString().trim();
                          if (text.isEmpty() || text.length() > 1000) {
                              Toast.makeText(this, "Prompt 1 se 1000 characters ka hona chahiye.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          generateImage(text);
                      }).show();
              }

              void generateImage(String prompt) {
                  android.app.ProgressDialog progress = new android.app.ProgressDialog(this);
                  progress.setMessage("JACK AI image bana raha hai...");
                  progress.setCancelable(false);
                  progress.show();

                  FirebaseAuth auth = FirebaseAuth.getInstance();
                  auth.signInAnonymously()
                      .addOnSuccessListener(result -> {
                          if (result.getUser() == null) {
                              progress.dismiss();
                              Toast.makeText(this, "Firebase login nahi ho saka.", Toast.LENGTH_LONG).show();
                              return;
                          }
                          result.getUser().getIdToken(false)
                              .addOnSuccessListener(tokenResult -> {
                                  String idToken = tokenResult.getToken();
                                  if (idToken == null || idToken.isEmpty()) {
                                      progress.dismiss();
                                      Toast.makeText(this, "Firebase token nahi mila.", Toast.LENGTH_LONG).show();
                                      return;
                                  }
                                  new Thread(() -> {
                                      HttpURLConnection connection = null;
                                      try {
                                          JSONObject body = new JSONObject();
                                          body.put("prompt", prompt);
                                          URL url = new URL(IMAGE_API_URL);
                                          connection = (HttpURLConnection) url.openConnection();
                                          connection.setRequestMethod("POST");
                                          connection.setConnectTimeout(20000);
                                          connection.setReadTimeout(120000);
                                          connection.setDoOutput(true);
                                          connection.setRequestProperty("Content-Type", "application/json");
                                          connection.setRequestProperty("Authorization", "Bearer " + idToken);
                                          byte[] data = body.toString().getBytes("UTF-8");
                                          try (OutputStream output = connection.getOutputStream()) {
                                              output.write(data);
                                          }
                                          int status = connection.getResponseCode();
                                          if (status != 200) {
                                              InputStream errorStream = connection.getErrorStream();
                                              StringBuilder error = new StringBuilder("Image service HTTP " + status);
                                              if (errorStream != null) {
                                                  BufferedReader reader = new BufferedReader(new InputStreamReader(errorStream, "UTF-8"));
                                                  String line;
                                                  while ((line = reader.readLine()) != null) error.append(" ").append(line);
                                                  reader.close();
                                              }
                                              throw new Exception(error.toString());
                                          }
                                          android.graphics.Bitmap bitmap;
                                          try (InputStream stream = connection.getInputStream()) {
                                              bitmap = android.graphics.BitmapFactory.decodeStream(stream);
                                          }
                                          if (bitmap == null) throw new Exception("Image data decode nahi hui.");
                                          runOnUiThread(() -> {
                                              progress.dismiss();
                                              ImageView imageView = new ImageView(this);
                                              imageView.setImageBitmap(bitmap);
                                              imageView.setAdjustViewBounds(true);
                                              imageView.setMaxHeight(900);
                                              new android.app.AlertDialog.Builder(this)
                                                  .setTitle("JACK AI Generated Image")
                                                  .setView(imageView)
                                                  .setPositiveButton("CLOSE", (d, w) -> d.dismiss())
                                                  .show();
                                          });
                                      } catch (Exception e) {
                                          String message = e.getMessage() == null ? "Image generation failed" : e.getMessage();
                                          runOnUiThread(() -> {
                                              progress.dismiss();
                                              Toast.makeText(this, message, Toast.LENGTH_LONG).show();
                                          });
                                      } finally {
                                          if (connection != null) connection.disconnect();
                                      }
                                  }).start();
                              })
                              .addOnFailureListener(error -> {
                                  progress.dismiss();
                                  Toast.makeText(this, "Firebase token error: " + error.getMessage(), Toast.LENGTH_LONG).show();
                              });
                      })
                      .addOnFailureListener(error -> {
                          progress.dismiss();
                          Toast.makeText(this, "Anonymous login error: " + error.getMessage(), Toast.LENGTH_LONG).show();
                      });
              }

              void configureTts() {
                  if (tts == null || !ttsReady) return;

                  tts.setOnUtteranceProgressListener(
                      new UtteranceProgressListener() {
                      @Override public void onStart(String id) {}

                      @Override
                      public void onDone(String id) {
                          handler.post(() -> {
                              if (isFinishing() || activityPaused) return;
                              if ("JACK_WAKE_GREETING".equals(id) &&
                                  wakeCommandPending) {
                                  beginListening(false);
                              }
                              if ("JACK_REPLY".equals(id) &&
                                  wakeCommandPending) {
                                  wakeCommandPending = false;
                                  restartWakeWord();
                              }
                          });
                      }

                      @Override
                      public void onError(String id) {
                          handler.post(() -> {
                              if ("JACK_REPLY".equals(id) &&
                                  wakeCommandPending) {
                                  wakeCommandPending = false;
                                  restartWakeWord();
                              }
                          });
                      }
                  });

                  setTtsLanguage();
              }

              void setTtsLanguage() {
                  if (tts == null || !ttsReady) return;
                  Locale locale = english
                      ? Locale.US : new Locale("ur", "PK");
                  int result = tts.setLanguage(locale);

                  if (result == TextToSpeech.LANG_MISSING_DATA ||
                      result == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts.setLanguage(Locale.US);
                      Toast.makeText(this,
                          "Selected voice unavailable. Using fallback.",
                          Toast.LENGTH_LONG).show();
                      return;
                  }

                  tts.setSpeechRate(english ? 0.92f : 0.82f);
                  tts.setPitch(1.0f);

                  try {
                      Set<Voice> voices = tts.getVoices();
                      Voice best = null;
                      if (voices != null) {
                          for (Voice voice : voices) {
                              if (voice.getLocale().getLanguage()
                                  .equals(locale.getLanguage()) &&
                                  !voice.isNetworkConnectionRequired()) {
                                  if (best == null ||
                                      voice.getQuality() > best.getQuality()) {
                                      best = voice;
                                  }
                              }
                          }
                      }
                      if (best != null) tts.setVoice(best);
                  } catch (Exception ignored) {}
              }

              void speak(String text) {
                  if (tts != null && ttsReady &&
                      text != null && !text.trim().isEmpty()) {
                      tts.setSpeechRate(english ? 0.92f : 0.82f);
                      tts.setPitch(1.0f);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH,
                          null, "JACK_REPLY");
                  }
              }

              void speakWakeGreeting() {
                  if (tts != null && ttsReady) {
                      String greeting = english
                          ? "Yes boss! How can I help you?"
                          : "جی باس! کیا کام ہے؟";
                      tts.speak(greeting, TextToSpeech.QUEUE_FLUSH,
                          null, "JACK_WAKE_GREETING");
                  } else {
                      handler.postDelayed(() -> {
                          if (wakeCommandPending && !isFinishing()) {
                              beginListening(false);
                          }
                      }, 1200);
                  }
              }

              void toggleWakeWord() {
                  boolean enabled = getSharedPreferences("jack_ai", MODE_PRIVATE)
                      .getBoolean("background_wake_enabled", false);
                  if (enabled) {
                      stopWakeWord();
                      Toast.makeText(this, "Background Hey JACK is OFF",
                          Toast.LENGTH_SHORT).show();
                  } else {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(
                              new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                          return;
                      }
                      startWakeWord();
                  }
              }

              void startWakeWord() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) return;
                  getSharedPreferences("jack_ai", MODE_PRIVATE).edit()
                      .putBoolean("background_wake_enabled", true).commit();
                  Intent service = new Intent(this, BackgroundWakeService.class);
                  try {
                      if (android.os.Build.VERSION.SDK_INT >= 26) {
                          startForegroundService(service);
                      } else {
                          startService(service);
                      }
                      wakeWordActive = true;
                      wakeButton.setText("BACKGROUND HEY JACK: ON");
                      Toast.makeText(this,
                          "Background listening ON. Notification will stay visible.",
                          Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      getSharedPreferences("jack_ai", MODE_PRIVATE).edit()
                          .putBoolean("background_wake_enabled", false).commit();
                      wakeWordActive = false;
                      wakeButton.setText("BACKGROUND HEY JACK: OFF");
                      Toast.makeText(this,
                          "Android could not start background listening. Check microphone permission.",
                          Toast.LENGTH_LONG).show();
                  }
              }

              void stopWakeWord() {
                  wakeWordActive = false;
                  wakeCommandPending = false;
                  getSharedPreferences("jack_ai", MODE_PRIVATE).edit()
                      .putBoolean("background_wake_enabled", false)
                      .putBoolean("wake_detected", false).commit();
                  stopService(new Intent(this, BackgroundWakeService.class));
                  wakeButton.setText("BACKGROUND HEY JACK: OFF");
                  mic.setText("MIC");
              }

              void restartWakeWord() {
                  boolean enabled = getSharedPreferences("jack_ai", MODE_PRIVATE)
                      .getBoolean("background_wake_enabled", false);
                  if (!enabled || isFinishing() || activityPaused) return;
                  handler.postDelayed(() -> {
                      if (!activityPaused && !isFinishing()) startWakeWord();
                  }, 900);
              }

              @Override
              public void onRequestPermissionsResult( int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults);
                  if (requestCode == 101 && grantResults.length > 0 &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startWakeWord();
                  } else if (requestCode == 101) {
                      Toast.makeText(this,
                          "Microphone permission is required.",
                          Toast.LENGTH_LONG).show();
                  }
              }

              void startVoiceInput() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      return;
                  }
                  if (wakeWordActive) stopWakeWord();
                  wakeCommandPending = false;
                  beginListening(false);
              }

              void beginListening(boolean wakeSession) {
                  if (isFinishing() || activityPaused) return;
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      if (wakeSession) stopWakeWord();
                      Toast.makeText(this,
                          "Speech recognition unavailable.",
                          Toast.LENGTH_LONG).show();
                      return;
                  }

                  try {
                      if (recognizer != null) {
                          recognizer.cancel();
                          recognizer.destroy();
                      }
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer.setRecognitionListener(
                          new RecognitionListener() {
                          @Override
                          public void onReadyForSpeech(Bundle params) {
                              mic.setText(wakeSession ? "WAKE..." : "LISTENING");
                          }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] b) {}
                          @Override public void onPartialResults(Bundle b) {}
                          @Override public void onEvent(int e, Bundle b) {}
                          @Override public void onEndOfSpeech() {
                              if (!wakeWordActive) mic.setText("MIC");
                          }

                          @Override
                          public void onError(int error) {
                              if (wakeSession && wakeWordActive) {
                                  restartWakeWord();
                              } else if (wakeCommandPending) {
                                  wakeCommandPending = false;
                                  mic.setText("MIC");
                                  speak("Sorry, please say your command again.");
                                  restartWakeWord();
                              } else {
                                  mic.setText("MIC");
                                  Toast.makeText(MainActivity.this,
                                      "Voice not recognized. Try again.",
                                      Toast.LENGTH_SHORT).show();
                              }
                          }

                          @Override
                          public void onResults(Bundle results) {
                              if (results == null) {
                                  if (wakeSession) restartWakeWord();
                                  return;
                              }
                              java.util.ArrayList<String> matches =
                                  results.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION);
                              if (matches == null || matches.isEmpty()) {
                                  if (wakeSession) restartWakeWord();
                                  return;
                              }

                              String spoken = matches.get(0);
                              if (wakeSession) {
                                  String normalized = spoken
                                      .toLowerCase(Locale.ROOT)
                                      .replaceAll("[^a-z ]", " ")
                                      .replaceAll("\\s+", " ")
                                      .trim();
                                  int index = normalized.indexOf("hey jack");
                                  if (index < 0) {
                                      index = normalized.indexOf("heyjack");
                                  }
                                  if (index >= 0) {
                                      wakeWordActive = false;
                                      wakeButton.setText("WAKE WORD: OFF");
                                      wakeCommandPending = true;
                                      String command = normalized
                                          .replaceFirst("hey\\s*jack", "")
                                          .trim();
                                      if (!command.isEmpty()) {
                                          handleVoiceCommand(command);
                                      } else {
                                          speakWakeGreeting();
                                      }
                                  } else {
                                      restartWakeWord();
                                  }
                              } else {
                                  mic.setText("MIC");
                                  handleVoiceCommand(spoken);
                              }
                          }
                      });

                      Intent intent = new Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      String lang = wakeSession
                          ? "en-US" : (english ? "en-US" : "ur-PK");
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, lang);
                      intent.putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                      recognizer.startListening(intent);
                  } catch (Exception e) {
                      if (wakeSession) restartWakeWord();
                      else if (wakeCommandPending) {
                          wakeCommandPending = false;
                          restartWakeWord();
                      }
                  }
              }

              void handleVoiceCommand(String command) {
                  String text = command == null ? "" :
                      command.toLowerCase(Locale.ROOT).trim();
                  if (text.isEmpty()) {
                      if (wakeCommandPending) speakWakeGreeting();
                      return;
                  }
                  if (openPhoneFeature(text)) return;
                  input.setText(command);
                  sendMessage();
              }

              boolean openPhoneFeature(String command) {
                  String c = command.toLowerCase(Locale.ROOT);
                  boolean youtube =
                      c.contains("youtube") || c.contains("you tube");
                  boolean whatsapp =
                      c.contains("whatsapp") || c.contains("whats app");
                  boolean camera =
                      c.contains("camera") || c.contains("take a photo");
                  boolean settings =
                      c.contains("settings") || c.contains("phone setting");

                  if (!youtube && !whatsapp && !camera && !settings) {
                      return false;
                  }

                  try {
                      Intent intent;
                      if (youtube) {
                          intent = getPackageManager().getLaunchIntentForPackage(
                              "com.google.android.youtube");
                          if (intent == null) {
                              intent = new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://www.youtube.com"));
                          }
                          speak("Opening YouTube.");
                      } else if (whatsapp) {
                          intent = getPackageManager().getLaunchIntentForPackage(
                              "com.whatsapp");
                          if (intent == null) {
                              intent = new Intent(Intent.ACTION_VIEW,
                                  Uri.parse("https://www.whatsapp.com"));
                          }
                          speak("Opening WhatsApp.");
                      } else if (camera) {
                          intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          speak("Opening camera.");
                      } else {
                          intent = new Intent(Settings.ACTION_SETTINGS);
                          speak("Opening settings.");
                      }

                      final Intent launchIntent = intent;
                      launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      handler.postDelayed(() -> {
                          try {
                              startActivity(launchIntent);
                          } catch (Exception e) {
                              Toast.makeText(this,
                                  "Could not open this app.",
                                  Toast.LENGTH_SHORT).show();
                          }
                      }, 1000);
                  } catch (Exception e) {
                      speak("Sorry, I could not open that app.");
                  }
                  return true;
              }

              void sendMessage() {
                  String question = input.getText().toString().trim();
                  if (question.isEmpty() || busy) return;

                  busy = true;
                  send.setEnabled(false);
                  input.setText("");
                  addBubble("You: " + question, CYAN, Gravity.END);

                  try {
                      JSONObject userMessage = new JSONObject();
                      userMessage.put("role", "user");
                      userMessage.put("content", question);
                      history.put(userMessage);
                      JSONArray requestHistory =
                          new JSONArray(history.toString());
                      TextView reply = addBubble(
                          "JACK AI: ", WHITE, Gravity.START);

                      new Thread(() -> {
                          StringBuilder answer = new StringBuilder();
                          HttpURLConnection connection = null;
                          try {
                              JSONObject body = new JSONObject();
                              body.put("messages", requestHistory);
                              body.put("replyLanguage", "auto");
                              body.put("uiLanguage", english ? "en" : "ur");
                              body.put("thinkingDepth", "medium");
                              body.put("smartMemoryEnabled", false);
                              body.put("voiceMode", true);
                              body.put("voiceSpeechLanguage",
                                  english ? "en" : "ur");

                              URL url = new URL(API_URL);
                              connection = (HttpURLConnection) url.openConnection();
                              connection.setRequestMethod("POST");
                              connection.setConnectTimeout(20000);
                              connection.setReadTimeout(90000);
                              connection.setDoOutput(true);
                              connection.setRequestProperty(
                                  "Content-Type", "application/json");
                              connection.setRequestProperty(
                                  "Accept", "text/event-stream");

                              byte[] data = body.toString().getBytes("UTF-8");
                              try (OutputStream output =
                                  connection.getOutputStream()) {
                                  output.write(data);
                              }

                              int status = connection.getResponseCode();
                              if (status != 200) {
                                  InputStream es = connection.getErrorStream();
                                  StringBuilder error =
                                      new StringBuilder("HTTP " + status);
                                  if (es != null) {
                                      BufferedReader er = new BufferedReader(
                                          new InputStreamReader(es, "UTF-8"));
                                      String el;
                                      while ((el = er.readLine()) != null) {
                                          error.append(el);
                                      }
                                  }
                                  throw new Exception(error.toString());
                              }

                              try (BufferedReader reader =
                                  new BufferedReader(new InputStreamReader(
                                      connection.getInputStream(), "UTF-8"))) {
                                  String line;
                                  boolean completed = false;
                                  while ((line = reader.readLine()) != null) {
                                      if (!line.startsWith("data:")) continue;
                                      String jsonText =
                                          line.substring(5).trim();
                                      if (jsonText.isEmpty()) continue;
                                      JSONObject event = new JSONObject(jsonText);
                                      String type = event.optString("type");
                                      if ("delta".equals(type)) {
                                          answer.append(event.optString("text"));
                                          String current = answer.toString();
                                          runOnUiThread(() ->
                                              reply.setText("JACK AI: " + current));
                                      }
                                      if ("error".equals(type)) {
                                          throw new Exception(event.optString(
                                              "message", "AI response failed"));
                                      }
                                      if ("done".equals(type)) completed = true;
                                  }
                                  if (!completed || answer.length() == 0) {
                                      throw new Exception(
                                          "AI response was incomplete.");
                                  }
                              }

                              JSONObject assistantMessage = new JSONObject();
                              assistantMessage.put("role", "assistant");
                              assistantMessage.put("content", answer.toString());
                              history.put(assistantMessage);
                              String finalAnswer = answer.toString();
                              runOnUiThread(() -> speak(finalAnswer));

                          } catch (Exception e) {
                              String error = e.getMessage();
                              runOnUiThread(() -> {
                                  reply.setText("JACK AI: Connection error: " +
                                      error);
                                  if (wakeCommandPending) {
                                      wakeCommandPending = false;
                                      restartWakeWord();
                                  }
                              });
                          } finally {
                              if (connection != null) connection.disconnect();
                              runOnUiThread(() -> {
                                  busy = false;
                                  send.setEnabled(true);
                                  input.requestFocus();
                                  scroll.post(() ->
                                      scroll.fullScroll(View.FOCUS_DOWN));
                              });
                          }
                      }).start();
                  } catch (Exception e) {
                      busy = false;
                      send.setEnabled(true);
                      addBubble("Error: " + e.getMessage(),
                          WHITE, Gravity.START);
                  }
              }

              TextView addBubble(String text, int color, int gravity) {
                  TextView bubble = new TextView(this);
                  bubble.setText(text);
                  bubble.setTextColor(color);
                  bubble.setTextSize(16);
                  bubble.setPadding(14, 12, 14, 12);
                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-2, -2);
                  params.gravity = gravity;
                  params.setMargins(4, 8, 4, 8);
                  messages.addView(bubble, params);
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
                  return bubble;
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  activityPaused = true;
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  activityPaused = false;
                  if (floatingButton != null) {
                      floatingButton.setText(
                          FloatingJackService.isRunning()
                              ? "FLOATING JACK: ON"
                              : "FLOATING JACK: OFF");
                  }
                  boolean backgroundEnabled = getSharedPreferences("jack_ai", MODE_PRIVATE)
                      .getBoolean("background_wake_enabled", false);
                  wakeWordActive = backgroundEnabled;
                  if (wakeButton != null) {
                      wakeButton.setText(backgroundEnabled
                          ? "BACKGROUND HEY JACK: ON"
                          : "BACKGROUND HEY JACK: OFF");
                  }
                  boolean detected = getSharedPreferences("jack_ai", MODE_PRIVATE)
                      .getBoolean("wake_detected", false);
                  if (detected) {
                      getSharedPreferences("jack_ai", MODE_PRIVATE).edit()
                          .putBoolean("wake_detected", false).commit();
                      wakeCommandPending = true;
                      speakWakeGreeting();
                  }
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (recognizer != null) {
                      try {
                          recognizer.cancel();
                          recognizer.destroy();
                      } catch (Exception ignored) {}
                      recognizer = null;
                  }
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }
                  super.onDestroy();
              }
          }
