name: Build JACK AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jackai/assistant
          mkdir -p app/src/main/res/drawable-nodpi
          echo "" | base64 -d > app/src/main/res/drawable-nodpi/jack_mascot.webp

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JACK AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.jackai.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jackai.assistant"
                  minSdk = 23
                  targetSdk = 32
                  versionCode = 10
                  versionName = "2.0"
              }
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:34.0.0"))
              implementation("com.google.firebase:firebase-auth")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <queries> <package android:name="com.whatsapp"/> <package android:name="com.google.android.youtube"/> <intent> <action android:name="android.speech.RecognitionService"/> </intent> <intent> <action android:name="android.intent.action.TTS_SERVICE"/> </intent> </queries>

              <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="JACK AI" android:allowBackup="false"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN"/> <category android:name="android.intent.category.LAUNCHER"/> </intent-filter> </activity> <service android:name=".FloatingJackService" android:exported="false"/> <service android:name=".BackgroundWakeService" android:exported="false" android:foregroundServiceType="microphone" android:stopWithTask="false"/> </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jackai/assistant/FloatingJackService.java <<'EOF'
          package com.jackai.assistant;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Toast;

          public class FloatingJackService extends Service {
              public static final String ACTION_STOP =
                  "com.jackai.assistant.STOP_FLOATING_JACK";

              private static volatile boolean running = false;

              public static boolean isRunning() {
                  return running;
              }

              private WindowManager windowManager;
              private JackFaceView faceView;
              private WindowManager.LayoutParams params;

              @Override
              public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  faceView = new JackFaceView();
                  params = new WindowManager.LayoutParams(
                      dp(176),
                      dp(222),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      android.graphics.PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.END;
                  params.x = dp(12);
                  params.y = dp(210);

                  faceView.setOnTouchListener(new View.OnTouchListener() {
                      private int startX;
                      private int startY;
                      private float downX;
                      private float downY;
                      private boolean moved;

                      @Override
                      public boolean onTouch(View view, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  startX = params.x;
                                  startY = params.y;
                                  downX = event.getRawX();
                                  downY = event.getRawY();
                                  moved = false;
                                  return true;

                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (downX - event.getRawX());
                                  int dy = (int) (event.getRawY() - downY);
                                  if (Math.abs(dx) > dp(5) || Math.abs(dy) > dp(5)) {
                                      moved = true;
                                  }
                                  params.x = Math.max(0, startX + dx);
                                  params.y = Math.max(0, startY + dy);
                                  try {
                                      windowManager.updateViewLayout(faceView, params);
                                  } catch (Exception ignored) {}
                                  return true;

                              case MotionEvent.ACTION_UP:
                                  if (!moved) {
                                      Intent open = new Intent(
                                          FloatingJackService.this,
                                          MainActivity.class
                                      );
                                      open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                                          | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                      startActivity(open);
                                      Toast.makeText(
                                          FloatingJackService.this,
                                          "JACK AI opened",
                                          Toast.LENGTH_SHORT
                                      ).show();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  try {
                      windowManager.addView(faceView, params);
                      running = true;
                  } catch (Exception e) {
                      running = false;
                      stopSelf();
                  }
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  running = false;
                  if (faceView != null && windowManager != null) {
                      try {
                          windowManager.removeView(faceView);
                      } catch (Exception ignored) {}
                  }
                  faceView = null;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private class JackFaceView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  private final float density =
                      getResources().getDisplayMetrics().density;
                  private final Bitmap mascot = BitmapFactory.decodeResource(
                      getResources(), R.drawable.jack_mascot);

                  JackFaceView() {
                      super(FloatingJackService.this);
                      setLayerType(View.LAYER_TYPE_HARDWARE, null);
                      post(invalidateLoop);
                  }

                  private final Runnable invalidateLoop = new Runnable() {
                      @Override public void run() {
                          invalidate();
                          postDelayed(this, 65);
                      }
                  };

                  private float d(float value) { return value * density; }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      float w = getWidth();
                      float h = getHeight();
                      float t = System.currentTimeMillis() / 720.0f;
                      float bob = (float) Math.sin(t) * d(3.5f);
                      p.setShader(null);
                      p.setColor(Color.argb(42, 0, 210, 255));
                      canvas.drawCircle(w / 2f, h * .49f, d(68), p);
                      if (mascot != null) {
                          float imageW = mascot.getWidth();
                          float imageH = mascot.getHeight();
                          float scale = Math.min((w - d(4)) / imageW,
                              (h - d(6)) / imageH);
                          float dw = imageW * scale;
                          float dh = imageH * scale;
                          float left = (w - dw) / 2f;
                          float top = (h - dh) / 2f + bob;
                          canvas.save();
                          canvas.rotate((float) Math.sin(t * .65f) * 1.2f,
                              w / 2f, h / 2f);
                          canvas.drawBitmap(mascot, null,
                              new android.graphics.RectF(left, top, left + dw, top + dh), p);
                          canvas.restore();
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jackai/assistant/BackgroundWakeService.java <<'EOF'
          package com.jackai.assistant;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.os.Bundle;
          import java.util.ArrayList;
          import java.util.Locale;

          public class BackgroundWakeService extends Service {
              public static final String ACTION_STOP =
                  "com.jackai.assistant.STOP_BACKGROUND_WAKE";
              private static final String CHANNEL_ID = "jack_wake_channel";
              private static final int NOTIFICATION_ID = 1901;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SpeechRecognizer recognizer;
              private boolean stopping = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  startForeground(NOTIFICATION_ID, buildNotification());
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      getSharedPreferences("jack_ai", MODE_PRIVATE)
                          .edit().putBoolean("background_wake_enabled", false).commit();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  stopping = false;
                  startRecognition();
                  return START_NOT_STICKY;
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "JACK AI Wake Word", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("Shows when JACK AI is listening for Hey JACK");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              private Notification buildNotification() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent openPending = PendingIntent.getActivity(
                      this, 1902, open,
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));

                  Intent stop = new Intent(this, BackgroundWakeService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent stopPending = PendingIntent.getService(
                      this, 1903, stop,
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0));

                  Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);
                  builder.setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("JACK AI is listening")
                      .setContentText("Microphone active for the Hey JACK wake phrase")
                      .setContentIntent(openPending)
                      .setOngoing(true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel,
                          "Turn OFF", stopPending);
                  return builder.build();
              }

              private void startRecognition() {
                  if (stopping) return;
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      handler.postDelayed(this::startRecognition, 4000);
                      return;
                  }
                  try {
                      if (recognizer != null) {
                          try { recognizer.cancel(); recognizer.destroy(); }
                          catch (Exception ignored) {}
                      }
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle params) {}
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}

                          @Override
                          public void onError(int error) {
                              scheduleRestart(1300);
                          }

                          @Override
                          public void onResults(Bundle results) {
                              ArrayList<String> matches = results == null ? null
                                  : results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              boolean detected = false;
                              if (matches != null) {
                                  for (String phrase : matches) {
                                      if (phrase == null) continue;
                                      String normalized = phrase.toLowerCase(Locale.ROOT)
                                          .replaceAll("[^a-z ]", " ")
                                          .replaceAll("\\s+", " ").trim();
                                      if (normalized.contains("hey jack") ||
                                          normalized.contains("heyjack")) {
                                          detected = true;
                                          break;
                                      }
                                  }
                              }
                              if (detected) {
                                  getSharedPreferences("jack_ai", MODE_PRIVATE)
                                      .edit().putBoolean("wake_detected", true).commit();
                                  Intent launch = new Intent(BackgroundWakeService.this, MainActivity.class);
                                  launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                  try { startActivity(launch); } catch (Exception ignored) {}
                                  stopSelf();
                              } else {
                                  scheduleRestart(700);
                              }
                          }
                      });

                      Intent speech = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US");
                      speech.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "en-US");
                      speech.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      speech.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                      recognizer.startListening(speech);
                  } catch (Exception e) {
                      scheduleRestart(2000);
                  }
              }

              private void scheduleRestart(long delay) {
                  if (!stopping) handler.postDelayed(this::startRecognition, delay);
              }

              @Override
              public void onDestroy() {
                  stopping = true;
                  handler.removeCallbacksAndMessages(null);
                  if (recognizer != null) {
                      try { recognizer.cancel(); recognizer.destroy(); }
                      catch (Exception ignored) {}
                      recognizer = null;
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          cat > app/src/main/java/com/jackai/assistant/MainActivity.java <<'EOF'
          package com.jackai.assistant;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.Intent;
