
name: Build JACK AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jackai/assistant

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JACK AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.jackai.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jackai.assistant"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="JACK AI"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jackai/assistant/MainActivity.java <<'EOF'
          package com.jackai.assistant;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              LinearLayout messages;
              EditText input;
              ScrollView scroll;

              int white = Color.WHITE;
              int cyan = Color.rgb(0, 220, 255);
              int bg = Color.rgb(8, 15, 35);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);

                  TextView header = new TextView(this);
                  header.setText("JACK AI");
                  header.setTextColor(cyan);
                  header.setTextSize(26);
                  header.setTypeface(null, Typeface.BOLD);
                  header.setGravity(Gravity.CENTER);
                  header.setPadding(12, 22, 12, 18);
                  root.addView(header);

                  TextView welcome = new TextView(this);
                  welcome.setText("Ji boss! Kya kaam hai?");
                  welcome.setTextColor(white);
                  welcome.setTextSize(17);
                  welcome.setGravity(Gravity.CENTER);
                  welcome.setPadding(10, 10, 10, 20);
                  root.addView(welcome);

                  scroll = new ScrollView(this);
                  messages = new LinearLayout(this);
                  messages.setOrientation(LinearLayout.VERTICAL);
                  messages.setPadding(12, 12, 12, 12);
                  scroll.addView(messages);

                  root.addView(scroll, new LinearLayout.LayoutParams(
                      -1, 0, 1
                  ));

                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setOrientation(LinearLayout.HORIZONTAL);
                  bottom.setGravity(Gravity.CENTER_VERTICAL);
                  bottom.setPadding(8, 8, 8, 12);

                  input = new EditText(this);
                  input.setHint("Message JACK AI...");
                  input.setHintTextColor(Color.LTGRAY);
                  input.setTextColor(white);
                  input.setSingleLine(true);
                  input.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(cyan)
                  );

                  bottom.addView(input, new LinearLayout.LayoutParams(
                      0, -2, 1
                  ));

                  Button send = new Button(this);
                  send.setText("SEND");
                  send.setTextColor(bg);
                  send.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(cyan)
                  );

                  bottom.addView(send);
                  root.addView(bottom);

                  send.setOnClickListener(v -> sendMessage());
                  input.setOnEditorActionListener((v, actionId, event) -> {
                      sendMessage();
                      return true;
                  });

                  setContentView(root);
              }

              void sendMessage() {
                  String message = input.getText().toString().trim();

                  if (message.isEmpty()) return;

                  addBubble("You: " + message, cyan, Gravity.END);
                  input.setText("");

                  addBubble(
                      "JACK AI: Chat interface ready! AI connection will be added next.",
                      white,
                      Gravity.START
                  );
              }

              void addBubble(String text, int color, int gravity) {
                  TextView bubble = new TextView(this);
                  bubble.setText(text);
                  bubble.setTextColor(color);
                  bubble.setTextSize(16);
                  bubble.setPadding(14, 12, 14, 12);
                  bubble.setGravity(Gravity.START);

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(-2, -2);

                  params.gravity = gravity;
                  params.setMargins(4, 8, 4, 8);

                  messages.addView(bubble, params);
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JACK-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
