name: Build JACK AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate JACK AI Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/jackai/assistant

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JACK AI"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.jackai.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jackai.assistant"
                  minSdk = 23
                  targetSdk = 32
                  versionCode = 11
                  versionName = "2.1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <queries>
                  <package android:name="com.whatsapp"/>
                  <package android:name="com.google.android.youtube"/>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="JACK AI"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingJackService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jackai/assistant/FloatingJackService.java <<'EOF'
          package com.jackai.assistant;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;

          public class FloatingJackService extends Service {
              private WindowManager wm;
              private JackView jack;
              private WindowManager.LayoutParams params;

              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  jack = new JackView();
                  params = new WindowManager.LayoutParams(
                      dp(112), dp(132),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      android.graphics.PixelFormat.TRANSLUCENT);
                  params.gravity = Gravity.TOP | Gravity.END;
                  params.x = dp(12);
                  params.y = dp(180);

                  jack.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy;
                      float dx, dy;
                      boolean dragged;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = params.x; sy = params.y;
                              dx = e.getRawX(); dy = e.getRawY();
                              dragged = false;
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              int mx = (int)(dx - e.getRawX());
                              int my = (int)(e.getRawY() - dy);
                              if (Math.abs(mx) > dp(4) || Math.abs(my) > dp(4)) dragged = true;
                              params.x = Math.max(0, sx + mx);
                              params.y = Math.max(0, sy + my);
                              try { wm.updateViewLayout(jack, params); } catch (Exception ignored) {}
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              if (!dragged) {
                                  Intent i = new Intent(FloatingJackService.this, MainActivity.class);
                                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                                  startActivity(i);
                              }
                              return true;
                          }
                          return false;
                      }
                  });
                  try { wm.addView(jack, params); } catch (Exception ex) { stopSelf(); }
              }

              private int dp(float n) {
                  return (int)(n * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override public int onStartCommand(Intent intent, int flags, int id) {
                  return START_STICKY;
              }

              @Override public void onDestroy() {
                  if (jack != null) {
                      try { wm.removeView(jack); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              private class JackView extends View {
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  JackView() { super(FloatingJackService.this); setLayerType(View.LAYER_TYPE_SOFTWARE, null); }
                  @Override protected void onDraw(Canvas c) {
                      super.onDraw(c);
                      float d = getResources().getDisplayMetrics().density;
                      float cx = getWidth()/2f, cy = getHeight()*.43f;
                      p.setColor(Color.argb(45, 0, 220, 255));
                      c.drawCircle(cx, cy, 49*d, p);
                      p.setColor(Color.rgb(20, 38, 92));
                      c.drawRoundRect(cx-36*d, cy-39*d, cx+36*d, cy+39*d, 25*d, 25*d, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(2*d);
                      p.setColor(Color.rgb(0, 225, 255));
                      c.drawRoundRect(cx-36*d, cy-39*d, cx+36*d, cy+39*d, 25*d, 25*d, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(Color.rgb(110, 245, 255));
                      c.drawOval(cx-22*d, cy-8*d, cx-8*d, cy+9*d, p);
                      c.drawOval(cx+8*d, cy-8*d, cx+22*d, cy+9*d, p);
                      p.setColor(Color.WHITE);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTypeface(Typeface.create("sans-serif", Typeface.BOLD));
                      p.setTextSize(12*d);
                      c.drawText("JACK AI", cx, getHeight()-12*d, p);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jackai/assistant/MainActivity.java <<'EOF'
          package com.jackai.assistant;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.RecognitionListener;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String API_URL =
                  "https://jack-ai-1.ai.studio/api/chat/stream";
              private final int BG = Color.rgb(7, 13, 31);
              private final int CYAN = Color.rgb(0, 220, 255);
              private LinearLayout messages;
              private EditText input;
              private ScrollView scroll;
              private Button send, mic, wake, floatButton, lang;
              private JSONArray history = new JSONArray();
              private SpeechRecognizer recognizer;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean english = false;
              private boolean wakeOn = false;
              private boolean busy = false;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  buildUi();
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true;
                          setTtsLanguage();
                      }
                  });
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(12, 12, 12, 8);
                  root.setBackgroundColor(BG);

                  TextView heading = new TextView(this);
                  heading.setText("JACK AI");
                  heading.setTextColor(CYAN);
                  heading.setTextSize(28);
                  heading.setGravity(Gravity.CENTER);
                  heading.setPadding(8, 14, 8, 14);
                  root.addView(heading);

                  TextView intro = new TextView(this);
                  intro.setText("Your smart AI assistant");
                  intro.setTextColor(Color.LTGRAY);
                  intro.setGravity(Gravity.CENTER);
                  root.addView(intro);

                  scroll = new ScrollView(this);
                  messages = new LinearLayout(this);
                  messages.setOrientation(LinearLayout.VERTICAL);
                  messages.setPadding(4, 12, 4, 12);
                  scroll.addView(messages);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));

                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  input = new EditText(this);
                  input.setSingleLine(true);
                  input.setTextColor(Color.WHITE);
                  input.setHintTextColor(Color.LTGRAY);
                  input.setHint("Message JACK AI...");
                  input.setImeOptions(EditorInfo.IME_ACTION_SEND);
                  row.addView(input, new LinearLayout.LayoutParams(0, -2, 1));

                  send = new Button(this);
                  send.setText("SEND");
                  row.addView(send);
                  root.addView(row);

                  LinearLayout controls = new LinearLayout(this);
                  controls.setGravity(Gravity.CENTER);
                  lang = new Button(this); lang.setText("URDU");
                  mic = new Button(this); mic.setText("MIC");
                  wake = new Button(this); wake.setText("HEY JACK: OFF");
                  floatButton = new Button(this); floatButton.setText("FLOAT");
                  controls.addView(lang); controls.addView(mic);
                  controls.addView(wake); controls.addView(floatButton);
                  root.addView(controls);

                  setContentView(root);
                  addMessage("JACK AI: Assalam-o-alaikum! Kya madad karun?", false);

                  send.setOnClickListener(v -> sendMessage());
                  input.setOnEditorActionListener((v, action, event) -> {
                      if (action == EditorInfo.IME_ACTION_SEND) { sendMessage(); return true; }
                      return false;
                  });
                  lang.setOnClickListener(v -> {
                      english = !english;
                      lang.setText(english ? "ENGLISH" : "URDU");
                      setTtsLanguage();
                  });
                  mic.setOnClickListener(v -> startVoiceInput());
                  wake.setOnClickListener(v -> toggleWakeWord());
                  floatButton.setOnClickListener(v -> toggleFloating());
              }

              private void addMessage(String text, boolean user) {
                  TextView bubble = new TextView(this);
                  bubble.setText(text);
                  bubble.setTextColor(user ? CYAN : Color.WHITE);
                  bubble.setTextSize(16);
                  bubble.setPadding(12, 10, 12, 10);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(2, 6, 2, 6);
                  messages.addView(bubble, lp);
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
              }

              private void sendMessage() {
                  String question = input.getText().toString().trim();
                  if (question.isEmpty() || busy) return;
                  busy = true;
                  send.setEnabled(false);
                  input.setText("");
                  addMessage("YOU: " + question, true);
                  try {
                      JSONObject u = new JSONObject();
                      u.put("role", "user"); u.put("content", question);
                      history.put(u);
                  } catch (Exception ignored) {}
                  final JSONArray requestHistory;
                  try { requestHistory = new JSONArray(history.toString()); }
                  catch (Exception e) { finishSend(); return; }
                  TextView answerView = new TextView(this);
                  answerView.setTextColor(Color.WHITE);
                  answerView.setTextSize(16);
                  answerView.setPadding(12, 10, 12, 10);
                  messages.addView(answerView);
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));

                  new Thread(() -> {
                      HttpURLConnection conn = null;
                      StringBuilder answer = new StringBuilder();
                      try {
                          JSONObject body = new JSONObject();
                          body.put("messages", requestHistory);
                          body.put("replyLanguage", "auto");
                          body.put("uiLanguage", english ? "en" : "ur");
                          body.put("voiceMode", true);
                          URL url = new URL(API_URL);
                          conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(20000);
                          conn.setReadTimeout(90000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setRequestProperty("Accept", "text/event-stream");
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(body.toString().getBytes("UTF-8"));
                          }
                          int code = conn.getResponseCode();
                          if (code != 200) throw new Exception("Server response: " + code);
                          try (BufferedReader reader = new BufferedReader(
                              new InputStreamReader(conn.getInputStream(), "UTF-8"))) {
                              String line;
                              boolean done = false;
                              while ((line = reader.readLine()) != null) {
                                  if (!line.startsWith("data:")) continue;
                                  String payload = line.substring(5).trim();
                                  if (payload.isEmpty()) continue;
                                  JSONObject event = new JSONObject(payload);
                                  String type = event.optString("type");
                                  if ("delta".equals(type)) {
                                      answer.append(event.optString("text"));
                                      String current = answer.toString();
                                      runOnUiThread(() -> answerView.setText("JACK AI: " + current));
                                  } else if ("error".equals(type)) {
                                      throw new Exception(event.optString("message", "AI error"));
                                  } else if ("done".equals(type)) {
                                      done = true;
                                  }
                              }
                              if (!done || answer.length() == 0) throw new Exception("Empty or incomplete reply");
                          }
                          JSONObject a = new JSONObject();
                          a.put("role", "assistant"); a.put("content", answer.toString());
                          history.put(a);
                          String spoken = answer.toString();
                          runOnUiThread(() -> speak(spoken));
                      } catch (Exception e) {
                          String message = e.getMessage() == null ? "Connection failed" : e.getMessage();
                          runOnUiThread(() -> answerView.setText("JACK AI: " + message));
                      } finally {
                          if (conn != null) conn.disconnect();
                          runOnUiThread(this::finishSend);
                      }
                  }).start();
              }

              private void finishSend() {
                  busy = false;
                  send.setEnabled(true);
              }

              private void setTtsLanguage() {
                  if (tts == null || !ttsReady) return;
                  int result = tts.setLanguage(english ? Locale.US : new Locale("ur", "PK"));
                  if (result == TextToSpeech.LANG_MISSING_DATA ||
                      result == TextToSpeech.LANG_NOT_SUPPORTED) {
                      tts.setLanguage(Locale.US);
                  }
              }

              private void speak(String text) {
                  if (tts != null && ttsReady) {
                      setTtsLanguage();
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "JACK_REPLY");
                  }
              }

              private boolean hasMicPermission() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) return true;
                  requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 41);
                  return false;
              }

              private void startVoiceInput() {
                  if (!hasMicPermission()) return;
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      Toast.makeText(this, "Speech recognition is unavailable", Toast.LENGTH_LONG).show();
                      return;
                  }
                  listen(false);
              }

              private void toggleWakeWord() {
                  if (wakeOn) {
                      wakeOn = false;
                      wake.setText("HEY JACK: OFF");
                      if (recognizer != null) {
                          try { recognizer.cancel(); recognizer.destroy(); } catch (Exception ignored) {}
                          recognizer = null;
                      }
                      return;
                  }
                  if (!hasMicPermission()) return;
                  wakeOn = true;
                  wake.setText("HEY JACK: ON");
                  Toast.makeText(this, "Wake word runs only while JACK AI is open. Say Hey JACK.", Toast.LENGTH_LONG).show();
                  listen(true);
              }

              private void listen(boolean wakeSession) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) return;
                  try {
                      if (recognizer != null) {
                          try { recognizer.cancel(); recognizer.destroy(); } catch (Exception ignored) {}
                      }
                      recognizer = SpeechRecognizer.createSpeechRecognizer(this);
                      recognizer.setRecognitionListener(new RecognitionListener() {
                          @Override public void onReadyForSpeech(Bundle b) { mic.setText(wakeSession ? "WAKE..." : "LISTENING"); }
                          @Override public void onBeginningOfSpeech() {}
                          @Override public void onRmsChanged(float r) {}
                          @Override public void onBufferReceived(byte[] b) {}
                          @Override public void onEndOfSpeech() {}
                          @Override public void onError(int error) {
                              mic.setText("MIC");
                              if (wakeSession && wakeOn) listen(true);
                          }
                          @Override public void onResults(Bundle b) {
                              mic.setText("MIC");
                              if (b == null) { if (wakeSession && wakeOn) listen(true); return; }
                              java.util.ArrayList<String> list = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                              if (list == null || list.isEmpty()) { if (wakeSession && wakeOn) listen(true); return; }
                              String spoken = list.get(0);
                              if (wakeSession) {
                                  String normalized = spoken.toLowerCase(Locale.ROOT);
                                  int index = normalized.indexOf("hey jack");
                                  if (index >= 0) {
                                      wakeOn = false;
                                      wake.setText("HEY JACK: OFF");
                                      String command = spoken.substring(Math.min(spoken.length(), index + 8)).trim();
                                      if (command.isEmpty()) speak("Ji, boliye.");
                                      else handleVoiceCommand(command);
                                  } else if (wakeOn) {
                                      listen(true);
                                  }
                              } else {
                                  handleVoiceCommand(spoken);
                              }
                          }
                          @Override public void onPartialResults(Bundle b) {}
                          @Override public void onEvent(int event, Bundle b) {}
                      });
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, wakeSession ? "en-US" : (english ? "en-US" : "ur-PK"));
                      intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                      recognizer.startListening(intent);
                  } catch (Exception e) {
                      if (wakeSession && wakeOn) listen(true);
                  }
              }

              private void handleVoiceCommand(String command) {
                  String c = command.toLowerCase(Locale.ROOT);
                  if (c.contains("open whatsapp") || c.contains("whatsapp")) {
                      launchPackage("com.whatsapp", "https://www.whatsapp.com");
                  } else if (c.contains("open youtube") || c.contains("youtube")) {
                      launchPackage("com.google.android.youtube", "https://www.youtube.com");
                  } else if (c.contains("open camera") || c.contains("camera")) {
                      try { startActivity(new Intent("android.media.action.IMAGE_CAPTURE")); }
                      catch (Exception e) { speak("Camera could not be opened."); }
                  } else if (c.contains("open settings") || c.contains("settings")) {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  } else {
                      input.setText(command);
                      sendMessage();
                  }
              }

              private void launchPackage(String packageName, String fallback) {
                  Intent i = getPackageManager().getLaunchIntentForPackage(packageName);
                  if (i == null) i = new Intent(Intent.ACTION_VIEW, Uri.parse(fallback));
                  try { startActivity(i); } catch (Exception e) { speak("Could not open that app."); }
              }

              private void toggleFloating() {
                  if (!Settings.canDrawOverlays(this)) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName()));
                      startActivity(i);
                      Toast.makeText(this, "Allow display over other apps, then tap FLOAT again.", Toast.LENGTH_LONG).show();
                      return;
                  }
                  try {
                      startService(new Intent(this, FloatingJackService.class));
                      Toast.makeText(this, "Floating JACK started. Tap FLOAT again to stop is not available yet; use app restart to clear it.", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Could not start floating JACK.", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override protected void onPause() {
                  super.onPause();
                  if (wakeOn) {
                      wakeOn = false;
                      wake.setText("HEY JACK: OFF");
                      if (recognizer != null) {
                          try { recognizer.cancel(); recognizer.destroy(); } catch (Exception ignored) {}
                          recognizer = null;
                      }
                  }
              }

              @Override protected void onDestroy() {
                  if (recognizer != null) {
                      try { recognizer.cancel(); recognizer.destroy(); } catch (Exception ignored) {}
                      recognizer = null;
                  }
                  if (tts != null) { tts.stop(); tts.shutdown(); tts = null; }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JACK-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
